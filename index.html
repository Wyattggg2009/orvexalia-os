<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2a"><title>Orvexalia OS | Genesis v0.2</title><style>
:root{color-scheme:dark;--bg:#0a101a;--panel:#111c2c;--line:#25344a;--muted:#a4b3c6;--accent:#6be5c3;--text:#f0f5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#183449 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#172437;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left}button:hover,button:focus-visible{border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:18px 24px;background:#0c1523;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;letter-spacing:4px}.brand span{color:var(--accent)}.tag{color:var(--accent);font-size:11px;letter-spacing:1.5px} .shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 78px)}aside{padding:20px 12px;border-right:1px solid var(--line);background:#0c1523}nav{display:grid;gap:5px}nav button{border:1px solid transparent;background:transparent;color:var(--muted)}nav button.active{background:#1c3442;color:var(--accent);border-color:#355b64}main{padding:32px;max-width:1400px;width:100%}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(28px,5vw,45px);margin:8px 0 10px;line-height:1.1}h2{font-size:20px;margin:0 0 12px}p{color:var(--muted);line-height:1.6}.hero{padding:26px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,#152638,#102033);margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile{padding:20px;min-height:155px;background:var(--panel);display:flex;flex-direction:column;gap:8px}.tile strong{font-size:19px}.tile span{font-size:13px;color:var(--muted);line-height:1.5}.tile .symbol{font-size:24px;color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 16px}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.record span{overflow-wrap:anywhere}.muted{font-size:12px;color:var(--muted)}.form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input{padding:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;flex:1;min-width:160px}.primary{background:var(--accent);color:#072920;border-color:var(--accent);font-weight:700}.notice{padding:12px 16px;border:1px solid #665534;background:#262319;color:#f5d999;border-radius:10px;font-size:13px;margin:0 0 22px}footer{margin-top:22px;color:var(--muted);font-size:12px}.integrations{margin-top:24px}.small{font-size:12px}.danger{color:#f5a6a6}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:16px}header{padding:12px 16px}.hero{padding:20px}}
.brand{display:flex;align-items:center;gap:8px;letter-spacing:2px}.search{display:flex;gap:8px;margin:0 0 16px}.metric{padding:16px;background:#101f2b;border:1px solid var(--line);border-radius:12px;min-height:82px}.metric strong{font-size:25px;color:var(--accent);display:block}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;color:var(--accent);margin-top:6px}.tile[hidden]{display:none}@media(max-width:420px){.brand{font-size:17px;letter-spacing:1px}.record{flex-wrap:wrap}}
[hidden]{display:none!important}.login{max-width:460px;margin:24px auto}.login form{display:grid;gap:12px}.login label{display:grid;gap:6px}.login input{width:100%}.login .primary{text-align:center}.shell.signed-out{grid-template-columns:1fr}.signed-out aside{display:none}.signed-out main{max-width:none}.error{color:#ffb6b6;overflow-wrap:anywhere}.success{color:var(--accent)}
</style></head><body><header><div><div class="brand"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 14V34L24 45 6 34V14Z" fill="none" stroke="#6be5c3" stroke-width="2.5"/><path d="M12 13 24 36 36 13 24 21Z" fill="#6be5c3"/></svg> ORVEXALIA<span> OS</span></div><div class="tag">ONE SYSTEM · EVERY WORLD · NO LIMITS</div></div><div class="actions"><button id="home" hidden>⌂ Desktop</button><button id="refresh" hidden>↻ Refresh</button><button id="logout" hidden>Sign out</button></div></header><div class="shell"><aside><nav id="nav" aria-label="Applications"></nav></aside><main id="main"></main></div><script src="./config.js?v=84595aa2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script>
'use strict';
const apps=[
 {id:'intelligence',name:'Intelligence',icon:'◈',desc:'Fictional missions, dossiers and investigations.',sections:['Mission board','Classified archives','Personnel and clearances'],item:'mission'},
 {id:'together',name:'Together',icon:'♡',desc:'Private memories, milestones and shared plans.',sections:['Memory collection','Milestones','Shared activities'],item:'memory'},
 {id:'city',name:'City',icon:'▥',desc:'A simulated city, citizens and civic life.',sections:['City registry','Government','Economy and property'],item:'city record'},
 {id:'entertainment',name:'Entertainment',icon:'▷',desc:'Personal media, games and watchlists.',sections:['Media library','Watchlist','Games'],item:'watchlist entry'},
 {id:'emergency',name:'Emergency Services',icon:'✚',desc:'Fictional dispatch and incident management.',sections:['Training incidents','Unit roster','Incident reports'],item:'training incident'},
 {id:'enterprise',name:'Enterprise',icon:'▤',desc:'Simulated companies, teams and operations.',sections:['Company registry','Departments','Employee records'],item:'company'},
 {id:'family',name:'Family',icon:'⌂',desc:'Household tasks, rewards and calendars.',sections:['Chores','Family calendar','Rewards'],item:'chore'}
];
const integrations=['All Club Credit Union','PROJECT OHANA-626','Messenger','Store','Identity','Cloud','Mail','Academy'];
const nav=document.getElementById('nav'),main=document.getElementById('main');function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function add(parent,...children){parent.append(...children);return parent}function btn(text,fn,cls=''){const e=el('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}function go(id){if(location.hash.slice(1)===id)render(id);else location.hash=id}function hero(title,desc,sub){const e=el('section','hero');add(e,el('div','eyebrow',sub),el('h1','',title),el('p','',desc));main.append(e)}function card(title,desc,icon,fn){const b=btn('',fn,'tile');add(b,el('div','symbol',icon),el('strong','',title),el('span','',desc));return b}function footer(){main.append(el('footer','','Orvexalia OS • Genesis v0.2 • Identity & Cloud'))}
function desktop(){hero('Welcome, '+member.display_name+'','Your connected digital universe. Open an application to explore your private workspace.','System desktop');const metrics=el('div','metrics');for(const [value,label] of [[8,'Core systems'],[apps.reduce((n,a)=>n+records(a).length,0),'Cloud records'],['Genesis','Release']])add(metrics,add(el('div','metric'),el('strong','',String(value)),el('span','muted',label)));main.append(metrics);const search=el('input');search.type='search';search.placeholder='Search applications…';search.setAttribute('aria-label','Search applications');main.append(add(el('div','search'),search));const g=el('div','grid');const cards=[];for(const a of [...availableApps()]){const tile=card(a.name,a.desc,a.icon,()=>go(a.id));cards.push([a,tile]);g.append(tile)}const empty=el('p','muted','No matching applications.');empty.hidden=true;search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let matches=0;for(const [a,tile] of cards){tile.hidden=!(a.name+' '+a.desc).toLowerCase().includes(q);if(!tile.hidden)matches++}empty.hidden=matches!==0});main.append(g,empty);const p=el('section','panel integrations');add(p,el('h2','','Planned integrations'),el('p','','These are roadmap entries, not active connections. Existing projects remain unchanged.'));for(const i of integrations)add(p,add(el('div','record'),el('span','',i),el('span','muted','Planned')));main.append(p)}
let client=null,member=null,sessionUser=null,cache=[],epoch=0,readSeq=0,busy=false,booted=false,authEvents=0;
const shell=document.querySelector('.shell'),home=document.getElementById('home'),refresh=document.getElementById('refresh'),logout=document.getElementById('logout');
function records(a){return cache.filter(r=>r.app_id===a.id)}
function availableApps(){return member?.role==='developer'?[...apps,{id:'admin',name:'Orvexalia Control',desc:'Protected developer workspace and cloud diagnostics.',icon:'⚙'}]:apps}
function setShell(signedIn){shell.classList.toggle('signed-out',!signedIn);for(const b of [home,refresh,logout])b.hidden=!signedIn;}
function status(msg,error=false){let n=document.getElementById('status');if(!n){n=el('p');n.id='status';n.setAttribute('role','status');main.prepend(n)}n.className=error?'error':'success';n.textContent=msg;}
function login(message=''){setShell(false);nav.replaceChildren();main.replaceChildren();const p=el('section','panel login');add(p,el('div','eyebrow','ORVEXALIA GUARDIAN'),el('h1','','Sign in'),el('p','','Enter the credentials issued by your administrator.'));const f=el('form');const email=el('input');email.type='email';email.required=true;email.autocomplete='username';email.placeholder='Email address';const pass=el('input');pass.type='password';pass.required=true;pass.autocomplete='current-password';pass.placeholder='Password';const submit=el('button','primary','Sign in');submit.type='submit';const msg=el('p','error',message);msg.setAttribute('role','status');add(f,add(el('label','','Email'),email),add(el('label','','Password'),pass),submit,msg);p.append(f);main.append(p);f.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;msg.textContent='Signing in…';try{const {data,error}=await client.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(error)throw error;pass.value='';await applySession(data.session);}catch(err){msg.textContent=err.message||'Sign-in failed.';}finally{submit.disabled=false;}});}
function unavailable(message){setShell(false);main.replaceChildren();nav.replaceChildren();const p=el('section','panel login');add(p,el('h2','','Setup or connection required'),el('p','error',message),btn('Retry',()=>location.reload()),...(client?[btn('Sign out',async()=>{const {error}=await client.auth.signOut();if(error)status(error.message,true);else applySession(null)})]:[]));main.append(p);}
async function applySession(session){const version=++epoch;const id=session?.user?.id;if(!id){sessionUser=null;member=null;cache=[];busy=false;login();return;}sessionUser=id;member=null;cache=[];busy=false;setShell(false);main.replaceChildren(el('p','','Connecting to your workspace…'));try{const {data,error}=await client.from('orvexalia_members').select('user_id,display_name,role').eq('user_id',id).maybeSingle();if(version!==epoch)return;if(error)throw error;if(!data){unavailable('This account has not been activated by the developer.');return;}member=data;const ok=await loadRecords(version);if(!ok||version!==epoch)return;setShell(true);render(location.hash.slice(1));}catch(err){if(version===epoch)unavailable(err.message||'Unable to load account.');}}
async function loadRecords(version=epoch){const seq=++readSeq;const id=sessionUser;const all=[];const size=500;for(let start=0;;start+=size){const {data,error}=await client.from('orvexalia_records').select('id,app_id,title,created_at').eq('owner_id',id).order('created_at',{ascending:true}).order('id',{ascending:true}).range(start,start+size-1);if(version!==epoch||seq!==readSeq)return false;if(error)throw error;all.push(...data);if(data.length<size)break;}cache=all;return true;}
function frame(id){main.replaceChildren();nav.replaceChildren();for(const a of [{id:'desktop',name:'Desktop',icon:'⌂'},...availableApps()]){const b=btn(a.icon+'  '+a.name,()=>go(a.id),a.id===id?'active':'');if(a.id===id)b.setAttribute('aria-current','page');nav.append(b)}main.append(el('div','notice','CLOUD WORKSPACE · '+member.display_name+' · '+member.role.toUpperCase()+' · Private sample records. Simulation modules are not real public services.'));}
async function mutate(action,id){if(busy||!member)return;busy=true;const version=epoch;try{const result=await action();if(version!==epoch)return;if(result.error)throw result.error;if(!result.data?.length)throw Error('No record was changed. Refresh and try again.');if(await loadRecords(version)&&version===epoch){render(location.hash.slice(1));status('Cloud changes saved.');}}catch(err){if(version===epoch)status(err.message||'Unable to save change.',true);}finally{if(version===epoch)busy=false;}}
function app(a){hero('Orvexalia '+a.name,a.desc,'Application / '+a.id);const p=el('section','panel');add(p,el('h2','','Planned features'),el('p','',a.sections.join('  ·  ')));main.append(p);const list=el('section','panel');add(list,el('h2','','Cloud '+a.item+'s'),el('p','','Create, edit or delete your own sample records. Refresh on another device to see saved changes.'));const form=el('form','form');const input=el('input');input.placeholder='Add a sample '+a.item;input.setAttribute('aria-label','Sample '+a.item);input.required=true;input.maxLength=160;const submit=el('button','primary','Add');submit.type='submit';add(form,input,submit);form.addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(v)mutate(()=>client.from('orvexalia_records').insert({owner_id:sessionUser,app_id:a.id,title:v}).select('id'),a.id)});list.append(form);if(!records(a).length)list.append(el('p','muted','No cloud records yet.'));for(const r of records(a)){add(list,add(el('div','record'),el('span','',r.title),add(el('div','actions'),btn('Edit',()=>{const v=prompt('Edit sample record',r.title);if(v!==null&&v.trim())mutate(()=>client.from('orvexalia_records').update({title:v.trim().slice(0,160)}).eq('id',r.id).eq('owner_id',sessionUser).select('id'),a.id)}),btn('Delete',()=>{if(confirm('Delete this cloud record?'))mutate(()=>client.from('orvexalia_records').delete().eq('id',r.id).eq('owner_id',sessionUser).select('id'),a.id)},'danger'))))}main.append(list)}
function admin(){if(member?.role!=='developer'){go('desktop');return;}hero('Orvexalia Control','Developer-only workspace. Account creation and role assignment currently take place in the Supabase dashboard.','System administration');const p=el('section','panel');add(p,el('h2','','Cloud connection'),el('p','','Authenticated as '+member.display_name+' • '+member.role),el('p','','Only your own records are accessible here. Other members’ private records remain isolated.'));for(const a of apps)add(p,add(el('div','record'),el('span','',a.name),el('strong','',String(records(a).length))));main.append(p);const backup=el('section','panel');add(backup,el('h2','','Export your records'),el('p','','Exports an unencrypted JSON snapshot of your own records only.'),btn('Export JSON',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:'0.2',records:cache},null,2)],{type:'application/json'}));const link=el('a');link.href=url;link.download='orvexalia-cloud-backup.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'primary'));main.append(backup);}
function render(id){if(!member)return;if(!availableApps().some(a=>a.id===id))id='desktop';frame(id);if(id==='desktop')desktop();else if(id==='admin')admin();else app(apps.find(a=>a.id===id));footer();}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));home.addEventListener('click',()=>go('desktop'));refresh.addEventListener('click',async()=>{if(!member||busy)return;try{const {data,error}=await client.auth.getSession();if(error)throw error;await applySession(data.session);}catch(err){status(err.message,true);}});logout.addEventListener('click',async()=>{try{const {error}=await client.auth.signOut();if(error)throw error;await applySession(null);}catch(err){status(err.message,true);}});
async function boot(){const cfg=window.ORVEXALIA_CONFIG;if(!cfg||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(cfg.url)||!/^sb_publishable_/.test(cfg.key)){unavailable('Edit config.js with your Supabase project URL and publishable key.');return;}if(!window.supabase){unavailable('Supabase client library could not load. Check your internet connection and retry.');return;}try{client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});client.auth.onAuthStateChange((event,session)=>{if(event==='INITIAL_SESSION')return;if(event==='SIGNED_OUT'||(event==='SIGNED_IN'&&session?.user?.id!==sessionUser)){const eventId=++authEvents;setTimeout(()=>{if(eventId===authEvents)applySession(session)},0);}});const {data,error}=await client.auth.getSession();if(error)throw error;await applySession(data.session);}catch(err){unavailable(err.message||'Connection failed.');}}
boot();
</script></body></html>
