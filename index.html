<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2a"><title>Orvexalia OS | Genesis v0.1</title><style>
:root{color-scheme:dark;--bg:#0a101a;--panel:#111c2c;--line:#25344a;--muted:#a4b3c6;--accent:#6be5c3;--text:#f0f5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#183449 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#172437;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left}button:hover,button:focus-visible{border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:18px 24px;background:#0c1523;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;letter-spacing:4px}.brand span{color:var(--accent)}.tag{color:var(--accent);font-size:11px;letter-spacing:1.5px} .shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 78px)}aside{padding:20px 12px;border-right:1px solid var(--line);background:#0c1523}nav{display:grid;gap:5px}nav button{border:1px solid transparent;background:transparent;color:var(--muted)}nav button.active{background:#1c3442;color:var(--accent);border-color:#355b64}main{padding:32px;max-width:1400px;width:100%}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(28px,5vw,45px);margin:8px 0 10px;line-height:1.1}h2{font-size:20px;margin:0 0 12px}p{color:var(--muted);line-height:1.6}.hero{padding:26px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,#152638,#102033);margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile{padding:20px;min-height:155px;background:var(--panel);display:flex;flex-direction:column;gap:8px}.tile strong{font-size:19px}.tile span{font-size:13px;color:var(--muted);line-height:1.5}.tile .symbol{font-size:24px;color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 16px}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.record span{overflow-wrap:anywhere}.muted{font-size:12px;color:var(--muted)}.form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input{padding:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;flex:1;min-width:160px}.primary{background:var(--accent);color:#072920;border-color:var(--accent);font-weight:700}.notice{padding:12px 16px;border:1px solid #665534;background:#262319;color:#f5d999;border-radius:10px;font-size:13px;margin:0 0 22px}footer{margin-top:22px;color:var(--muted);font-size:12px}.integrations{margin-top:24px}.small{font-size:12px}.danger{color:#f5a6a6}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:16px}header{padding:12px 16px}.hero{padding:20px}}
.brand{display:flex;align-items:center;gap:8px;letter-spacing:2px}.search{display:flex;gap:8px;margin:0 0 16px}.metric{padding:16px;background:#101f2b;border:1px solid var(--line);border-radius:12px;min-height:82px}.metric strong{font-size:25px;color:var(--accent);display:block}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;color:var(--accent);margin-top:6px}.tile[hidden]{display:none}@media(max-width:420px){.brand{font-size:17px;letter-spacing:1px}.record{flex-wrap:wrap}}
</style></head><body><header><div><div class="brand"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 14V34L24 45 6 34V14Z" fill="none" stroke="#6be5c3" stroke-width="2.5"/><path d="M12 13 24 36 36 13 24 21Z" fill="#6be5c3"/></svg> ORVEXALIA<span> OS</span></div><div class="tag">ONE SYSTEM · EVERY WORLD · NO LIMITS</div></div><button id="home">⌂ Desktop</button></header><div class="shell"><aside><nav id="nav" aria-label="Applications"></nav></aside><main id="main"></main></div><script>
'use strict';
const apps=[
 {id:'intelligence',name:'Intelligence',icon:'◈',desc:'Fictional missions, dossiers and investigations.',sections:['Mission board','Classified archives','Personnel and clearances'],item:'mission'},
 {id:'together',name:'Together',icon:'♡',desc:'Private memories, milestones and shared plans.',sections:['Memory collection','Milestones','Shared activities'],item:'memory'},
 {id:'city',name:'City',icon:'▥',desc:'A simulated city, citizens and civic life.',sections:['City registry','Government','Economy and property'],item:'city record'},
 {id:'entertainment',name:'Entertainment',icon:'▷',desc:'Personal media, games and watchlists.',sections:['Media library','Watchlist','Games'],item:'watchlist entry'},
 {id:'emergency',name:'Emergency Services',icon:'✚',desc:'Fictional dispatch and incident management.',sections:['Training incidents','Unit roster','Incident reports'],item:'training incident'},
 {id:'enterprise',name:'Enterprise',icon:'▤',desc:'Simulated companies, teams and operations.',sections:['Company registry','Departments','Employee records'],item:'company'},
 {id:'family',name:'Family',icon:'⌂',desc:'Household tasks, rewards and calendars.',sections:['Chores','Family calendar','Rewards'],item:'chore'}
];
const integrations=['All Club Credit Union','PROJECT OHANA-626','Messenger','Store','Identity','Cloud','Mail','Academy'];
let storageOK=true;function read(){try{return JSON.parse(localStorage.getItem('orvexalia-genesis-v01')||'{}')||{}}catch(e){storageOK=false;return {}}}let data=read();if(typeof data!=='object'||Array.isArray(data))data={};function save(){try{localStorage.setItem('orvexalia-genesis-v01',JSON.stringify(data))}catch(e){storageOK=false}}
const nav=document.getElementById('nav'),main=document.getElementById('main');function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function add(parent,...children){parent.append(...children);return parent}function btn(text,fn,cls=''){const e=el('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}function go(id){if(location.hash.slice(1)===id)render(id);else location.hash=id}function frame(id){main.replaceChildren();nav.replaceChildren();for(const a of [{id:'desktop',name:'Desktop',icon:'⌂'},...apps,{id:'admin',name:'Orvexalia Control',icon:'⚙'}]){const b=btn(a.icon+'  '+a.name,()=>go(a.id),a.id===id?'active':'');if(a.id===id)b.setAttribute('aria-current','page');nav.append(b)}main.append(el('div','notice','LOCAL PROTOTYPE · Sample workflows only. No sign-in, server, shared data or real emergency dispatch. '+(storageOK?'Records are saved on this browser when storage is available.':'Browser storage is unavailable; changes may be lost.')))}
function hero(title,desc,sub){const e=el('section','hero');add(e,el('div','eyebrow',sub),el('h1','',title),el('p','',desc));main.append(e)}function card(title,desc,icon,fn){const b=btn('',fn,'tile');add(b,el('div','symbol',icon),el('strong','',title),el('span','',desc));return b}function footer(){main.append(el('footer','','Orvexalia OS • Genesis v0.1 • Browser-only prototype'))}
function desktop(){hero('Welcome to Orvexalia','Your connected digital universe. Open an application to explore the prototype.','System desktop');const metrics=el('div','metrics');for(const [value,label] of [[8,'Core systems'],[apps.reduce((n,a)=>n+records(a).length,0),'Local records'],['Genesis','Release']])add(metrics,add(el('div','metric'),el('strong','',String(value)),el('span','muted',label)));main.append(metrics);const search=el('input');search.type='search';search.placeholder='Search applications…';search.setAttribute('aria-label','Search applications');main.append(add(el('div','search'),search));const g=el('div','grid');const cards=[];for(const a of [...apps,{id:'admin',name:'Orvexalia Control',desc:'View local records and reset prototype data.',icon:'⚙'}]){const tile=card(a.name,a.desc,a.icon,()=>go(a.id));cards.push([a,tile]);g.append(tile)}const empty=el('p','muted','No matching applications.');empty.hidden=true;search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let matches=0;for(const [a,tile] of cards){tile.hidden=!(a.name+' '+a.desc).toLowerCase().includes(q);if(!tile.hidden)matches++}empty.hidden=matches!==0});main.append(g,empty);const p=el('section','panel integrations');add(p,el('h2','','Planned integrations'),el('p','','These are roadmap entries, not active connections. Existing projects remain unchanged.'));for(const i of integrations)add(p,add(el('div','record'),el('span','',i),el('span','muted','Planned')));main.append(p)}
function records(a){if(!Array.isArray(data[a.id]))data[a.id]=[];return data[a.id]}
function app(a){hero('Orvexalia '+a.name,a.desc,'Application / '+a.id);const p=el('section','panel');add(p,el('h2','','Planned features'),el('p','',a.sections.join('  ·  ')));main.append(p);const list=el('section','panel');add(list,el('h2','','Local '+a.item+'s'),el('p','','Try creating and deleting a sample record. This is a simple demonstration, not the full module.'));const form=el('form','form');const input=el('input');input.placeholder='Add a sample '+a.item;input.setAttribute('aria-label','Sample '+a.item);input.required=true;input.maxLength=160;const submit=el('button','primary','Add');submit.type='submit';add(form,input,submit);form.addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v)return;records(a).push({title:v,id:Date.now().toString(36)+Math.random().toString(36).slice(2)});save();render(a.id)});list.append(form);if(!records(a).length)list.append(el('p','muted','No sample records yet.'));for(const r of records(a)){if(!r||typeof r.title!=='string')continue;add(list,add(el('div','record'),el('span','',r.title),add(el('div','actions'),btn('Edit',()=>{const v=prompt('Edit sample record',r.title);if(v!==null&&v.trim()){r.title=v.trim().slice(0,160);save();render(a.id)}}),btn('Delete',()=>{if(confirm('Delete this sample record?')){data[a.id]=records(a).filter(x=>x.id!==r.id);save();render(a.id)}},'danger'))))}main.append(list)}
function admin(){hero('Orvexalia Control','Prototype controls only. This screen is not protected by authentication.','System administration');const p=el('section','panel');add(p,el('h2','','Local record overview'));for(const a of apps)add(p,add(el('div','record'),el('span','',a.name),el('strong','',String(records(a).length))));main.append(p);const backup=el('section','panel');add(backup,el('h2','','Export local data'),el('p','','Save a JSON snapshot of sample records. It is not encrypted; do not enter private information.'),btn('Export JSON',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:'0.1',records:data},null,2)],{type:'application/json'}));const link=el('a');link.href=url;link.download='orvexalia-local-backup.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'primary'));main.append(backup);const q=el('section','panel');add(q,el('h2','','Reset prototype'),el('p','','Removes all sample records from this browser. No external data will be affected.'),btn('Reset all local records',()=>{if(confirm('Delete all Orvexalia prototype records on this browser?')){data={};save();render('admin')}},'danger'));main.append(q)}
function render(id){if(id!=='admin'&&!apps.some(a=>a.id===id))id='desktop';frame(id);if(id==='desktop')desktop();else if(id==='admin')admin();else app(apps.find(a=>a.id===id));footer()}window.addEventListener('hashchange',()=>render(location.hash.slice(1)));document.getElementById('home').addEventListener('click',()=>go('desktop'));render(location.hash.slice(1));
</script></body></html>
